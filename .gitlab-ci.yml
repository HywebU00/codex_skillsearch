stages:
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

build:
  stage: build
  tags:
    - allUiRunner

  script:
    - npm cache clean --force
    - npm ci --cache .npm --prefer-offline
    - npm run build # 請確認會產出 dist/ 資料夾

  artifacts:
    paths:
      - dist
    expire_in: 1 day

  rules:
    # 只在預設分支上跑（下面第三節會解釋）
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pages:
  stage: deploy
  tags:
    - allUiRunner

  dependencies:
    - build

  script:
    - rm -rf public
    - mkdir public
    - cp -r dist/* public/

  artifacts:
    paths:
      - public

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
